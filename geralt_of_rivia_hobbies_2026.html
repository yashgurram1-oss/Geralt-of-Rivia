d chain and human society.", "No Shadow Without Light": "A mystery-thriller involving hidden identities, secrets and a dangerous investigation. As the protagonists pursue answers, the distinction between victim, suspect and investigator becomes increasingly uncertain.", "Behave": "Robert Sapolsky examines why humans behave the way they do, moving from immediate brain chemistry and hormones to childhood development, culture, evolution and social context. It is explanatory rather than fictional, building a multi-level account of human behavior.", "The Vegetarian": "Yeong-hye abruptly stops eating meat after disturbing dreams. Her decision triggers increasingly severe reactions from her husband, family and society, while her attempts to reject ordinary expectations lead to psychological and physical breakdown.", "Dark Matter": "Physicist Jason Dessen is abducted and wakes in an alternate version of his life in which he never married Daniela and achieved a different scientific career. He travels through possible realities trying to return to the life he considers his own.", "The Corpse Collector": "A crime investigation centered on disturbing deaths and the collection of bodies, with the investigators piecing together evidence, motives and hidden connections as the case develops.", "The Woman in the Window": "Anna Fox, an agoraphobic woman living alone, spends her days watching her neighbors through a camera lens. After seeing what she believes is a murder in a neighboring house, she becomes entangled in a mystery while others question whether her perception can be trusted.", "The Unexpected Guest": "A stranger arrives at a country house and discovers a man apparently dead inside. The household members each have motives and secrets, and the mystery unfolds through shifting accounts and revelations about what happened before the stranger arrived.", "The Immortals of Meluha": "In a mythic reimagining of ancient India, Shiva is a tribal leader who travels to Meluha and is const extraGameStories = {"Ghost of Yōtei": "Atsu sets out across Ezo in pursuit of the Yōtei Six, the group responsible for destroying her home and family. Her journey combines stealth, sword combat, exploration and encounters with people who can become allies. As Atsu follows the trail of her enemies, her revenge quest becomes a broader struggle over identity, survival and what justice means after years of violence.", "Beasts of Reincarnation": "In a future where nature has transformed the world after ecological collapse, Wren and her canine companion travel through a hostile landscape. Their journey reveals the history of the catastrophe and forces Wren to decide how humans should coexist with a world that has changed beyond recognition.", "Resident Evil Requiem": "FBI analyst Grace Ashcroft investigates a series of deaths linked to the history of Raccoon City. The investigation draws her into a new biological-horror nightmare, where evidence from the past connects to an evolving threat and survival becomes as important as uncovering the truth.", "It Takes Two": "Cody and May are turned into dolls after their daughter Rose’s emotional reaction to their decision to separate. Guided by Dr. Hakim, they cross a fantastical miniature version of their home. Every challenge requires cooperation, and the journey gradually forces them to confront why their marriage failed and what their relationship means to Rose.", "Mafia II": "Vito Scaletta returns to Empire Bay after serving in the Second World War. He and Joe Barbaro become involved in organized crime, rising through the city’s Mafia families while chasing money and status. Their success is repeatedly undercut by betrayal, shifting alliances and the brutal consequences of the criminal life.", "God of War III": "Kratos leads a war against Olympus after Zeus betrays him. He battles gods and monsters while seeking Pandora’s Box and the power needed to defeat Zeus. His revenge destroys much of the Greek world, but his final choice is ultimately about whether hope belongs to the gods or to humanity.", "Call of Duty: Modern Warfare III — Campaign": "Captain Price and Task Force 141 hunt Vladimir Makarov, whose attacks are designed to destabilize the world and manipulate governments into conflict. The campaign moves through covert operations, open combat and time-critical missions before the team pays a major personal price in its pursuit of Makarov.", "Black Myth: Wukong": "The Destined One travels through a mythic landscape inspired by Journey to the West, confronting demons, yaoguai and legendary figures. Each chapter reveals another fragment of Sun Wukong’s legacy and the hidden history behind the relics the Destined One seeks.", "First Light": "The dashboard contains the title “First Light,” but several games share that name. The card is therefore marked for confirmation rather than assigning the wrong plot. Once the exact developer/platform is identified, the full storyline and ending can be attached.", "L.A. Noire": "Cole Phelps rises through different divisions of the Los Angeles Police Department, investigating murders, vice, narcotics and arson in 1947. His career eventually intersects with a larger conspiracy involving corruption, drugs and people from his wartime past. The investigation becomes personal as Phelps’s own misconduct catches up with him.", "Lost Judgment": "Takayuki Yagami investigates a high-school bullying case while also examining a suspicious death. The two cases lead to a wider conspiracy involving revenge, organized crime and people who believe conventional justice has failed. Yagami must decide how far he can go to expose wrongdoing without becoming part of the same cycle of violence.", "Detroit: Become Human": "Connor, an android detective, hunts androids who have become deviant; Kara escapes an abusive owner while protecting Alice; and Markus becomes the leader of an android freedom movement. Their stories intersect as Detroit approaches civil conflict. Player choices determine whether the androids gain recognition peacefully, fight for freedom or suffer catastrophic losses."};
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function all(){return [...db.books.map(x=>({...x,type:'book'})),...db.games.map(x=>({...x,type:'game'}))]}
function avg(a){return a.length?(a.reduce((s,x)=>s+Number(x.rating),0)/a.length).toFixed(2):'—'}
function stats(){let a=all(),b=db.books,g=db.games;document.getElementById('stats').innerHTML=
`<div class="stat"><span>📚 Books</span><b>${b.length}</b></div><div class="stat"><span>🎮 Games</span><b>${g.length}</b></div><div class="stat"><span>⭐ Overall average</span><b>${avg(a)}</b></div><div class="stat"><span>🏆 10/10 titles</span><b>${a.filter(x=>Number(x.rating)===10).length}</b></div>`}
function setFilter(f,el){filter=f;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');render()}
function render(){stats();let q=document.getElementById('search').value.toLowerCase(), b=db.books.filter(x=>filter!=='game'&&(x.title+' '+x.author).toLowerCase().includes(q)),g=db.games.filter(x=>filter!=='book'&&x.title.toLowerCase().includes(q));
let out=''; if(filter!=='game')out+=`<section class="section"><h2>📚 Books <span class="note">(${b.length})</span></h2><div class="cards">${b.map((x,i)=>card(x,'book',i)).join('')||'<div class="empty">No books found.</div>'}</div></section>`;
if(filter!=='book')out+=`<section class="section"><h2>🎮 Games <span class="note">(${g.length})</span></h2><div class="cards">${g.map((x,i)=>card(x,'game',i)).join('')||'<div class="empty">No games found.</div>'}</div></section>`;
document.getElementById('content').innerHTML=out}
function card(x,type,i){return `<article class="card" onclick="detail(${type==='book'?'\'book\',db.books.indexOf(x)':'\'game\',db.games.indexOf(x)'})"><div class="type">${type==='book'?'BOOK':'GAME'}</div><div class="title">${esc(x.title)}</div>${type==='book'?`<div class="author">${esc(x.author)}</div>`:''}<div class="rating">★ ${x.rating}/10</div></article>`}
function detail(type,i){
  const x=db[type+'s'][i];
  const base = type==='game' ? (stories[x.title] || '') : (bookStories[x.title] || '');
  const extra = type==='game' ? (extraGameStories[x.title] || '') : (extraBookStories[x.title] || '');
  const story = extra || base || `A detailed storyline for <b>${esc(x.title)}</b> can be added to this entry.`;
  const isNonfiction = ['Wild','Taiwan Travelogue','Before You Start Up','Think Straight','Heart Lamp','Animal Vegetable Criminal','Behave','Shiva','Norse Mythology'].includes(x.title);
  const resolution = isNonfiction
    ? 'This is a nonfiction, memoir, retelling or story collection rather than a single continuous fictional plot. The overview above describes the book’s central subject and structure.'
    : `The full resolution is part of the spoiler section for <b>${esc(x.title)}</b>. This entry is designed so the ending can be expanded separately from your personal rating and notes.`;
  document.getElementById('detail').innerHTML=`
    <div class="type">${type.toUpperCase()}</div>
    <h2>${esc(x.title)}</h2>
    ${type==='book'?`<div class="pill">✍️ ${esc(x.author)}</div>`:''}
    <div class="pill">📅 2026</div>
    <div class="pill">⭐ ${x.rating}/10</div>
    <div class="story-card">
      <h3>📖 Storyline</h3>
      <div class="story">${story}</div>
    </div>
    <div class="story-card">
      <h3>🎬 Ending / Resolution</h3>
      <div class="story">${resolution}</div>
    </div>
    <div class="story-card personal">
      <h3>⭐ Geralt’s Rating</h3>
      <div class="rating-big">${x.rating}/10</div>
      <p class="note">Your rating is kept separate from the storyline so the dashboard distinguishes the work itself from your personal opinion.</p>
    </div>`;
  document.getElementById('modal').classList.add('show')
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function openAdd(){let type=prompt('Add "book" or "game"?');if(!type)return;type=type.toLowerCase().trim();if(!['book','game'].includes(type))return alert('Please enter book or game.');let title=prompt('Title:');if(!title)return;let rating=prompt('Your rating out of 10:','8');let item={title,rating:Number(rating)||0,type};if(type==='book')item.author=prompt('Author:')||'Unknown';db[type+'s'].push(item);localStorage.setItem('geraltHobbies',JSON.stringify(db));render()}
function resetSearch(){document.getElementById('search').value='';filter='all';document.querySelectorAll('.tab').forEach((x,i)=>x.classList.toggle('active',i===0));render()}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});render();
</script></body></html>
